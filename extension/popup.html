<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agente Personal</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        width: 360px;
        padding: 12px;
      }
    </style>
    <script type="module" src="dist/popup.js"></script>
  </head>
  <body>
    <div class="stack">
      <div class="row">
        <h1>Captura rápida</h1>
        <a href="options.html" id="options-link" title="Opciones">Opciones</a>
      </div>

      <div id="no-token" class="glass" hidden>
        <p style="margin: 0">Falta el token de la app. <a href="options.html" id="setup-link">Configúralo en Opciones</a>.</p>
      </div>

      <form id="capture" class="glass stack capture" autocomplete="off">
        <textarea
          id="text"
          name="text"
          rows="2"
          maxlength="2000"
          placeholder="Apunta algo…"
          aria-label="Texto a capturar"
          autofocus
        ></textarea>
        <input id="author" name="author" type="text" maxlength="200" placeholder="Autor (opcional)" aria-label="Autor" hidden />
        <div class="capture-row">
          <div id="kinds" class="kinds" role="group" aria-label="Tipo">
            <button type="button" class="kind" data-kind="auto" data-n="1" aria-pressed="true" aria-label="Auto" title="Auto (⌥1)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5.5c1.6 0 2.6-.6 3.5-1.9l1.4-2.2c.8-1.3 1.9-1.9 3.4-1.9H20M4 12h5.5c1.6 0 2.6.6 3.5 1.9l1.4 2.2c.8 1.3 1.9 1.9 3.4 1.9H20" /><path d="M17.5 3.6L20 6l-2.5 2.4M17.5 15.6L20 18l-2.5 2.4" /></svg>
              <span class="kind-label">Auto</span>
            </button>
            <button type="button" class="kind" data-kind="tarea" data-n="2" aria-pressed="false" aria-label="Tarea" title="Tarea (⌥2)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M8.3 12.3l2.5 2.4 4.9-5.2" /></svg>
              <span class="kind-label">Tarea</span>
            </button>
            <button type="button" class="kind" data-kind="idea" data-n="3" aria-pressed="false" aria-label="Idea" title="Idea (⌥3)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 17.2h5.6M10 20.2h4" /><path d="M12 3.6a5.9 5.9 0 0 0-3.6 10.6c.6.5.9 1.1.9 1.8v.9h5.4V16c0-.7.3-1.3.9-1.8A5.9 5.9 0 0 0 12 3.6z" /></svg>
              <span class="kind-label">Idea</span>
            </button>
            <button type="button" class="kind" data-kind="compra" data-n="4" aria-pressed="false" aria-label="Compra" title="Compra (⌥4)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 8h13.6l-1 11.2a1.6 1.6 0 0 1-1.6 1.4H7.8a1.6 1.6 0 0 1-1.6-1.4z" /><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5" /></svg>
              <span class="kind-label">Compra</span>
            </button>
            <button type="button" class="kind" data-kind="regalo" data-n="5" aria-pressed="false" aria-label="Regalo" title="Regalo (⌥5)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="8" width="16.4" height="4.2" rx="1.2" /><path d="M5.4 12.2v6.6a1.7 1.7 0 0 0 1.7 1.7h9.8a1.7 1.7 0 0 0 1.7-1.7v-6.6M12 8v12.5" /><path d="M12 8c-1-2.6-2.4-4-3.9-4a1.9 1.9 0 0 0 0 4M12 8c1-2.6 2.4-4 3.9-4a1.9 1.9 0 0 1 0 4" /></svg>
              <span class="kind-label">Regalo</span>
            </button>
            <button type="button" class="kind" data-kind="libro" data-n="6" aria-pressed="false" aria-label="Libro" title="Libro (⌥6)">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.4C10.3 5 8 4.4 4.6 4.5v13.9c3.4-.1 5.7.5 7.4 1.9 1.7-1.4 4-2 7.4-1.9V4.5C16 4.4 13.7 5 12 6.4z" /><path d="M12 6.4v13.9" /></svg>
              <span class="kind-label">Libro</span>
            </button>
          </div>
          <button type="button" id="work" class="work" aria-label="Trabajo" aria-pressed="false" title="Trabajo · no pasa por la IA">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="12.5" rx="2.6" /><path d="M9 7V5.6A1.6 1.6 0 0 1 10.6 4h2.8A1.6 1.6 0 0 1 15 5.6V7M3.5 12.5h17" /></svg>
          </button>
        </div>
        <div class="capture-row">
          <button type="submit" class="primary" id="send">Guardar</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section id="hoy" class="glass stack" aria-label="Hoy">
        <p id="headline" class="headline">Hoy</p>
        <p id="hoy-status" class="status"></p>
        <div id="events-box" hidden>
          <h2>Agenda</h2>
          <ul id="events" class="list"></ul>
        </div>
        <div id="personal-box" hidden>
          <h2>Personal</h2>
          <ul id="personal" class="list"></ul>
        </div>
        <div id="trabajo-box" hidden>
          <h2>Trabajo</h2>
          <ul id="trabajo" class="list"></ul>
        </div>
        <div class="row">
          <span id="unclassified" class="muted"></span>
          <a id="open-app" href="https://mini-marc-personal.vercel.app/hoy" target="_blank" rel="noopener">Abrir la app</a>
        </div>
      </section>
    </div>
  </body>
</html>
